# Blueprint Render : https://render.com/docs/blueprint-spec
services:
  - type: web
    name: edge-bot
    runtime: node
    plan: free
    region: frankfurt
    # Build : installe les dépendances puis enregistre la commande /config (idempotent).
    buildCommand: npm ci && npm run deploy
    startCommand: npm start
    # Render vérifie GET /health ; le bot répond dessus même pendant la connexion à Discord.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      # Optionnel : ID d'un serveur pour que /config apparaisse immédiatement.
      - key: GUILD_ID
        sync: false
      # Stockage des réglages (store.json) et des images/GIF.
      # Sans disque persistant, ces données sont effacées à chaque redéploiement.
      # Pour les garder : ajoute un disque (plan payant) et décommente ci-dessous.
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
    #   name: edge-data
    #   mountPath: /var/data
    #   sizeGB: 1
