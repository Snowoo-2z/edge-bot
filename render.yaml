# Blueprint Render : bouton "New +" > Blueprint > ce repo, sur le plan gratuit.
# Attention : le plan gratuit ENDORT un service qui ne recoit pas de trafic ENTRANT, et
# un process endormi ne peut pas se reveiller lui-meme. Mets un sondeur EXTERNE sur
# /health (UptimeRobot gratuit, 5 min) — ou prends Northflank, dont le Sandbox ne dort pas.
services:
  - type: web
    name: edge-bot
    plan: free
    runtime: node
    region: fra
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GUILD_ID
        value: "1558076024778919946"
      - key: EDGE_REQUIRE_MESSAGE_CONTENT
        value: "true"
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
