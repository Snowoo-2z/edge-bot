# Blueprint Render : "New +" > Blueprint > ce repo, sur le plan gratuit.
# Le plan gratuit endort un service qui ne recoit PAS de trafic ENTRANT ; deux etages le
# tiennent eveille :
#   1) interne (automatique) : Render injecte RENDER_EXTERNAL_URL, Edge se tape son propre
#      /health toutes les 4 min => l'horloge d'inactivite de Render ne va jamais au bout.
#      Aucun reglage ici. KEEPALIVE_URL ne sert qu'a changer cette URL ou cette frequence.
#   2) externe (filet)       : deploy/autoping-github.yml, a copier dans
#      .github/workflows/edge-autoping.yml, reveille le service deja endormi (redemarrage,
#      crash, deploy rate) toutes les 5 min depuis GitHub Actions. Regle ensuite la variable
#      de depot EDGE_HEALTH_URL = https://<service>.onrender.com/health.
# Ne regle PAS PORT : Render le fournit (defaut 10000) et la sonde s'y accroche tout seul.
# Runtime docker alternatif : `runtime: docker` et supprime buildCommand/startCommand
# (le Dockerfile du repo fait les deux, ecoute $PORT, tourne en non-root).
services:
  - type: web
    name: edge-bot
    plan: free
    runtime: node
    region: frankfurt   # seules valeurs du blueprint spec : oregon, ohio, virginia, frankfurt, singapore
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GUILD_ID
        value: "1558076024778919946"
      - key: EDGE_REQUIRE_MESSAGE_CONTENT
        value: "true"
      - key: DISCORD_TOKEN
        sync: false
      # La base passe par l'API HTTP de Supabase : rien d'autre a regler (ni mot de passe de
      # base, ni pooler, ni IP a autoriser). Le schema se colle dans l'editeur SQL : supabase/schema.sql
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optionnel : connection Postgres directe (pg). Ignore des que SUPABASE_URL est defini.
      - key: DATABASE_URL
        sync: false
